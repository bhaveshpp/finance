<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>Accounts · Finance</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <div id="hdr" class="hdr"></div>
  <main class="page">
    <div class="total-card"><small>Total balance</small><b id="total">0</b></div>
    <div class="toolbar"><h2>Accounts</h2><button id="add" class="btn btn-sm" type="button">+ Add</button></div>
    <div id="list"></div>
  </main>
  <nav id="nav" class="nav"></nav>

<script>
(() => {
  'use strict';
  const A = App;
  const { $, el, toast, call } = A;
  if (!A.requireLogin()) return;

  const S = A.store;
  let masters = S.masters();

  function render() {
    const list = $('list'); list.replaceChildren();
    $('total').textContent = '₹ ' + A.money(masters.accounts.reduce((s, a) => s + (Number(a.balance) || 0), 0));
    if (!masters.accounts.length) list.append(el('div', { class: 'empty', text: 'No accounts yet. Tap + Add.' }));
    masters.accounts.forEach((a) => {
      const bal = Number(a.balance) || 0;
      list.append(el('button', { class: 'row', type: 'button', onclick: () => openForm(a) },
        el('div', { class: 'ico', text: a.icon }),
        el('div', { class: 'row-main' }, el('div', { class: 'row-title', text: a.name }),
          a.note ? el('div', { class: 'row-sub', text: a.note.split('\n')[0] }) : null),
        el('div', { class: 'row-amt ' + (bal < 0 ? 'amt-expense' : ''), text: '₹ ' + A.money(bal) })));
    });
  }

  function openForm(acc) {
    const name = el('input', { id: 'aName', class: 'field', maxlength: '40', placeholder: 'e.g. Bank KOTAK', autocomplete: 'off' });
    const icon = el('input', { id: 'aIcon', class: 'field', maxlength: '8', placeholder: '🏦' });
    const open = el('input', { id: 'aOpen', class: 'field', type: 'text', inputmode: 'decimal', placeholder: '0' });
    const note = el('textarea', { id: 'aNote', class: 'field', maxlength: '300', placeholder: 'Account details (bank, A/c no. last digits, IFSC, …)' });
    const save = el('button', { class: 'btn btn-primary', type: 'submit', text: acc ? 'Update' : 'Add account' });
    if (acc) { name.value = acc.name; icon.value = acc.icon; open.value = String(acc.opening_balance); note.value = acc.note; }
    const form = el('form', { novalidate: true },
      el('label', { class: 'lbl', for: 'aName', text: 'Name' }), name,
      el('div', { class: 'two' },
        el('div', {}, el('label', { class: 'lbl', for: 'aIcon', text: 'Icon (emoji)' }), icon),
        el('div', {}, el('label', { class: 'lbl', for: 'aOpen', text: 'Opening balance' }), open)),
      el('label', { class: 'lbl', for: 'aNote', text: 'Note' }), note, save);
    let close;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!name.value.trim()) { toast('Enter account name.', 'error'); return; }
      const ob = open.value.trim() === '' ? 0 : Number(open.value.replace(/,/g, ''));
      if (!isFinite(ob)) { toast('Opening balance must be a number.', 'error'); return; }
      A.setBusy(save, true);
      try {
        A.storeMasters(await call('save_account', { id: acc ? acc.id : '', name: name.value.trim(), icon: icon.value.trim(), opening_balance: ob, note: note.value.trim() }));
        masters = S.masters(); S.invalidateAnalysis(); close(); toast('Saved'); render();
      } catch (err) { toast(err.message, 'error'); A.setBusy(save, false); }
    });
    close = A.openSheet(acc ? 'Edit account' : 'New account', form);
    name.focus();
  }
  $('add').addEventListener('click', () => openForm(null));

  async function refresh(quiet) {
    try { await S.resume(); masters = await S.refreshMasters(); render(); if (!quiet) toast('Refreshed'); }
    catch (err) { if (!quiet) toast(err.message, 'error'); }
  }
  window.addEventListener('finance:change', () => { masters = S.masters(); render(); });
  A.mountHeader('🏦 Accounts', () => refresh(false));
  A.mountNav('accounts');
  render(); S.resume();
  if (!S.mastersFresh()) refresh(true);
})();
</script>
</body>
</html>
